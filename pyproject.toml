[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ndvi-drought-timeseries"
version = "0.1.0"
description = "Trend, seasonality, and drought-anomaly analysis of NDVI vegetation time series."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Pranav Achar"}]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.6"]

[project.scripts]
ndvi-analyze = "ndvi_ts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
